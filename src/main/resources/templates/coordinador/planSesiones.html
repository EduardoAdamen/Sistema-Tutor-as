<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <main class="container my-4 flex-grow-1">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mi-titulo mb-0"><i class="bi bi-calendar2-week me-2"></i>Plan de Sesiones</h2>
                <small class="text-muted">Carrera: <strong th:text="${carrera.nombre}">ISC</strong> — Organiza las 10 sesiones semanales</small>
            </div>
            <a th:href="@{/coordinador/actividades}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver a Actividades
            </a>
        </div>

        <div th:if="${adaptadas == null or adaptadas.isEmpty()}" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            No tienes actividades adaptadas aún. Primero adapta actividades del PAT General antes de organizar el plan de sesiones.
        </div>

        <form th:if="${adaptadas != null and !adaptadas.isEmpty()}" th:action="@{/coordinador/plan-sesiones/guardar}" method="post">
            <div class="card shadow-sm rounded-4 overflow-hidden mb-4">
                <div class="table-responsive m-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 text-center" style="width: 100px;">Sesión</th>
                                <th>Actividad PAT Asignada</th>
                                <th class="text-center pe-4" style="width: 100px;">Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Sesión 1 -->
                            <tr th:each="i : ${#numbers.sequence(1, 10)}"
                                th:with="mapKey='sesion_' + ${i}, seleccionadoId=${planMap.containsKey('sesion_' + i) ? planMap['sesion_' + i] : null}">
                                <td class="ps-4 text-center">
                                    <span class="badge bg-secondary rounded-circle fs-6 px-3 py-2" th:text="${i}">1</span>
                                </td>
                                <td>
                                    <select th:name="${mapKey}" class="form-select">
                                        <option value="">-- Sin actividad asignada --</option>
                                        <option th:each="act : ${adaptadas}"
                                                th:value="${act.id}"
                                                th:text="${act.tituloAdaptado + ' (' + act.actividadGeneral.tipoActividad + ')'}"
                                                th:selected="${seleccionadoId != null and seleccionadoId == act.id}">
                                        </option>
                                    </select>
                                </td>
                                <td class="text-center pe-4">
                                    <span th:if="${seleccionadoId != null}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">
                                        <i class="bi bi-check-circle"></i>
                                    </span>
                                    <span th:if="${seleccionadoId == null}" class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25">
                                        <i class="bi bi-dash-circle"></i>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-light text-end p-3">
                    <button type="submit" class="btn btn-encabezado px-5 rounded-pill shadow-sm">
                        <i class="bi bi-save me-1"></i> Guardar Plan de Sesiones
                    </button>
                </div>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>
</body>
</html>
