<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h2 class="mi-titulo m-0">Mi Tutoría Asignada</h2>
        </div>

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-3" role="alert">
            <span th:text="${msg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Ficha de Información de la Asignación -->
        <div class="card shadow-sm mb-5 bg-light rounded-4 overflow-hidden">
            <div class="card-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-7">
                        <div class="fw-bold mb-2 text-dark fs-5">
                            Tutor: <span class="fw-normal" th:text="${asignacion.tutor.usuario.nombreCompleto}">Tutor</span>
                            <span class="text-muted fw-normal fs-6 ms-2" th:text="'(' + ${asignacion.tutor.usuario.correo} + ')'">correo</span>
                        </div>
                        <div class="text-dark mb-1 fs-6 fw-bold">
                            Carrera: <span class="fw-normal" th:text="${asignacion.grupo.carrera.nombre}">Carrera</span>
                        </div>
                        <div class="text-dark mb-2 fs-6 fw-bold">
                            Grupo: <span class="fw-normal" th:text="${asignacion.grupo.nombre}">Grupo</span>
                        </div>
                        <div class="text-dark mb-0 fs-6 fw-bold">
                            Periodo: <span class="fw-normal" th:text="${asignacion.periodo.clave}">Periodo</span>
                        </div>
                    </div>
                    <div class="col-md-5 text-md-end mt-4 mt-md-0">
                        <div class="d-inline-block text-start border-start border-3 border-secondary ps-4">
                            <div class="mb-2 text-muted fw-semibold fs-6">Día: <span class="text-dark" th:text="${asignacion.diaHorario}"></span></div>
                            <div class="mb-2 text-muted fw-semibold fs-6">Horario: <span class="text-dark" th:text="${asignacion.horaHorario} + ' - ' + ${asignacion.horaFinHorario}"></span></div>
                            <div class="text-muted fw-semibold fs-6">Aula: <span class="text-dark" th:text="${asignacion.aula}"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <!-- Columna Progreso -->
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm rounded-4 overflow-hidden h-100">
                    <div class="card-header bg-transparent border-bottom pt-3 pb-3 text-center">
                        <span class="fs-5 fw-bold text-secondary">Progreso de Asistencia</span>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-center align-items-center p-4">
                        <h1 class="display-1 fw-bold text-success mb-0" th:text="${porcentaje} + '%'"></h1>
                        <p class="text-muted text-center mt-2 mb-4">Porcentaje global de asistencia a sesiones de tutoría</p>
                        
                        <div class="progress w-100 shadow-sm mb-4" style="height: 25px;">
                            <div class="progress-bar bg-success" 
                                 role="progressbar" 
                                 th:style="'width: ' + ${porcentaje} + '%'" 
                                 th:attr="aria-valuenow=${porcentaje}" 
                                 aria-valuemin="0" aria-valuemax="100">
                                <span class="fw-bold fs-6" th:text="${porcentaje} + '%'"></span>
                            </div>
                        </div>
                        
                        <a href="#" th:attr="onclick=|verificarDescargaConstancia(event, ${porcentaje}, ${#lists.size(sesiones)}, '@{/constancia/tutorado/{idA}/{idT}(idA=${asignacion.id},idT=${tutorado.id})}')|" 
                           class="btn btn-outline-danger w-100 rounded-pill fw-bold">
                            <i class="bi bi-file-pdf-fill me-1"></i> Descargar Constancia
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
