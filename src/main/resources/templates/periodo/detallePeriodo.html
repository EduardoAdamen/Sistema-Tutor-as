<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-transparent border-bottom pt-3 pb-3">
                        <span class="fs-5 fw-bold text-dark">Detalle del Periodo Semestral</span>
                    </div>
                    <div class="card-body p-4">
                        <table class="table table-borderless mb-0">
                            <tr>
                                <th class="text-end fw-bold text-dark" style="width: 40%;">ID:</th>
                                <td class="text-secondary" th:text="${periodo.id}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Clave:</th>
                                <td class="text-secondary fw-bold" th:text="${periodo.clave}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Fecha de Inicio:</th>
                                <td class="text-secondary" th:text="${periodo.fechaInicio}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Fecha de Fin:</th>
                                <td class="text-secondary" th:text="${periodo.fechaFin}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Estatus:</th>
                                <td>
                                    <span th:if="${periodo.estatus.name() == 'activo'}"
                                          class="badge bg-success rounded-pill px-3 py-2">Activo</span>
                                    <span th:if="${periodo.estatus.name() == 'cerrado'}"
                                          class="badge bg-secondary rounded-pill px-3 py-2">Cerrado</span>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="card-footer bg-transparent border-top p-3 d-flex justify-content-between align-items-center">
                        <a th:href="@{/periodo/periodos}" class="btn btn-outline-secondary rounded-pill px-4">
                            Volver al listado
                        </a>
                        <div class="d-flex gap-2">
                            <a th:if="${periodo.estatus.name() == 'activo'}"
                               th:href="@{/periodo/cerrar/{id}(id=${periodo.id})}"
                               class="btn btn-outline-danger rounded-pill px-4"
                               onclick="return confirm('¿Está seguro de cerrar este periodo?');">
                                Cerrar
                            </a>
                            <a th:href="@{/periodo/editar/{id}(id=${periodo.id})}" class="btn btn-encabezado rounded-pill px-4">
                                Editar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
