<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h2 class="mi-titulo m-0">Detalles del Grupo</h2>
            <div>
                <a th:href="@{/sesion/grupo/{id}(id=${asignacion.id})}" class="btn btn-encabezado shadow-sm me-2">
                    <i class="bi bi-calendar-event me-1"></i> Sesiones del Grupo
                </a>
                <a th:href="@{/tutor/mis-grupos}" class="btn btn-outline-secondary shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Volver a Mis Grupos
                </a>
            </div>
        </div>

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <span th:text="${msg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Ficha de Información del Grupo -->
        <div class="card shadow-sm border-0 mb-4 bg-light">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h4 class="fw-bold mb-1" th:text="${asignacion.grupo.carrera.nombre} + ' - Grupo ' + ${asignacion.grupo.nombre}">Carrera - Grupo</h4>
                        <p class="text-muted mb-0">Periodo: <span th:text="${asignacion.periodo.clave}"></span></p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <div class="d-inline-block text-start border-start border-2 ps-3">
                            <div class="mb-1"><i class="bi bi-calendar-event text-primary me-2"></i><span th:text="${asignacion.diaHorario}"></span></div>
                            <div class="mb-1"><i class="bi bi-clock text-primary me-2"></i><span th:text="${asignacion.horaHorario}"></span></div>
                            <div><i class="bi bi-door-open text-primary me-2"></i><span th:text="${asignacion.aula}"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Alumnos (Tutorados) -->
        <div class="card shadow-sm mb-4">
             <div class="card-header mi-etiqueta pt-3 pb-3 d-flex justify-content-between align-items-center">
                 <span>Lista de Tutorados</span>
                 <span class="badge bg-light text-dark border">Total: <span th:text="${#lists.size(tutorados)}"></span></span>
             </div>
             
             <div class="table-responsive m-0">
                  <table class="table table-hover align-middle mb-0 bordes-fuertes">
                       <thead class="table-light">
                           <tr>
                               <th class="ps-4">Matrícula</th>
                               <th>Nombre del Tutorado</th>
                               <th>Semestre</th>
                               <th class="text-center pe-4" style="width: 25%">Asistencia Global</th>
                           </tr>
                       </thead>
                       <tbody>
                           <tr th:each="at : ${tutorados}">
                               <td class="ps-4 fw-semibold" th:text="${at.tutorado.usuario.numeroIdentificacion}"></td>
                               <td th:text="${at.tutorado.usuario.nombreCompleto}"></td>
                               <td th:text="${at.tutorado.semestre}"></td>
                               <td class="text-center pe-4">
                                    <div class="progress shadow-sm" style="height: 20px;">
                                        <div class="progress-bar bg-success"
                                             role="progressbar"
                                             th:style="'width: ' + ${porcentajes[at.tutorado.id]} + '%'"
                                             th:text="${porcentajes[at.tutorado.id]} + '%'">
                                        </div>
                                    </div>
                               </td>
                           </tr>
                           <tr th:if="${tutorados.empty}">
                               <td colspan="4" class="text-center py-5 text-muted">
                                   <i class="bi bi-people fs-1 d-block mb-2"></i>
                                   No hay tutorados asignados a este grupo.
                               </td>
                           </tr>
                       </tbody>
                  </table>
             </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
