<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/fragment :: navbar}"></nav>

<main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <div>
            <h2 class="mi-titulo m-0 d-inline-block me-3">Sesiones Registradas</h2>
            <span class="badge bg-secondary fs-6" th:if="${periodo != null}">
                Periodo Activo: <span th:text="${periodo.clave}"></span>
            </span>
        </div>
    </div>

    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm rounded-4 overflow-hidden mb-4">
        <div class="card-body p-0">
            <div class="table-responsive m-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Fecha</th>
                            <th>Carrera / Grupo</th>
                            <th>H. Inicio</th>
                            <th>H. Fin</th>
                            <th class="text-center">Evidencia</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(sesiones)}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No hay sesiones registradas en el periodo activo.
                            </td>
                        </tr>
                        <tr th:each="sesion : ${sesiones}">
                            <td class="ps-4 fw-semibold" th:text="${#temporals.format(sesion.fecha, 'dd/MM/yyyy')}">26/04/2026</td>
                            <td>
                                <span class="fw-bold" th:text="${sesion.asignacion.grupo.nombre}"></span><br>
                                <small class="text-muted" th:text="${sesion.asignacion.grupo.carrera.nombre}"></small>
                            </td>
                            <td th:text="${sesion.horaInicio}">10:00</td>
                            <td th:text="${sesion.horaFin}">12:00</td>
                            <td class="text-center">
                                <a th:if="${sesion.evidencia != null and !sesion.evidencia.isEmpty()}" 
                                   th:href="@{'/uploads/sesiones/' + ${sesion.evidencia}}" 
                                   target="_blank" class="btn btn-sm btn-outline-primary" title="Ver Evidencia">
                                    <i class="bi bi-file-earmark-text"></i> Archivo
                                </a>
                                <span th:unless="${sesion.evidencia != null and !sesion.evidencia.isEmpty()}" class="text-muted small">Sin evidencia</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/fragment :: footer}"></footer>
<div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
