<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"

      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">



<head th:replace="~{fragments/fragment :: head}"></head>



<body class="d-flex flex-column min-vh-100">


<nav th:replace="~{fragments/fragment :: navbar}"></nav>


<main class="container my-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">

        <h2 class="mi-titulo m-0">Mis Grupos Asignados</h2>

    </div>


    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">

        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${msg}"></span>

        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">

        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>

        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

    </div>



    <div class="card shadow-sm rounded-4 overflow-hidden">

        <div class="table-responsive m-0">

            <table class="table table-hover mb-0 align-middle">

                <thead class="table-light">

                    <tr>

                        <th class="ps-4">Periodo</th>

                        <th>Carrera</th>

                        <th>Grupo</th>

                        <th>Horario y Aula</th>

                        <th class="text-center pe-4">Acción</th>

                    </tr>

                </thead>

                <tbody>

                        <tr th:if="${#lists.isEmpty(asignaciones)}">

                            <td colspan="5" class="text-center py-4 text-muted">

                                <i class="bi bi-journal-x fs-2 d-block mb-2"></i>

                                No tienes grupos asignados actualmente.

                            </td>

                        </tr>

                        <tr th:each="a : ${asignaciones}">

                            <td class="ps-4 fw-semibold">

                                <span th:text="${a.periodo.clave}"></span>

                                <span th:if="${a.periodo.estatus.name() == 'activo'}" class="badge bg-success ms-1">Activo</span>

                            </td>

                            <td th:text="${a.grupo.carrera.nombre}"></td>

                            <td th:text="${a.grupo.nombre}"></td>

                            <td>

                                <span th:text="${a.diaHorario} + ' ' + ${a.horaHorario} + ' - ' + ${a.horaFinHorario}"></span><br>

                                <small class="text-muted">Aula: <span th:text="${a.aula}"></span></small>

                            </td>

                            <td class="text-center pe-4">

                                <a th:href="@{/tutor/grupo/{id}(id=${a.id})}" class="btn btn-outline-primary btn-sm">

                                    <i class="bi bi-people-fill me-1"></i> Ver Grupo

                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>



<!-- ===================== FOOTER ===================== -->

<footer th:replace="~{fragments/fragment :: footer}"></footer>

<div th:replace="~{fragments/fragment :: scripts}"></div>



</body>

</html>
