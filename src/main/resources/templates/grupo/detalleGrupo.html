<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-transparent border-bottom pt-3 pb-3">
                        <span class="fs-5 fw-bold text-secondary">Detalle de Grupo</span>
                    </div>
                    <div class="card-body p-4">
                        <table class="table table-borderless mb-0">
                            <tr>
                                <th class="text-end fw-bold text-dark" style="width: 40%;">ID:</th>
                                <td class="text-secondary" th:text="${grupo.id}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Nombre del Grupo:</th>
                                <td class="text-secondary" th:text="${grupo.nombre}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Carrera Asignada:</th>
                                <td class="text-secondary" th:text="${grupo.carrera.nombre}"></td>
                            </tr>
                        </table>
                    </div>
                    <div class="card-footer bg-transparent border-top p-3 d-flex justify-content-between">
                        <a th:href="@{/grupo/grupos}" class="btn btn-outline-secondary rounded-pill px-4">
                            Volver al listado
                        </a>
                        <a th:href="@{/grupo/editar/{id}(id=${grupo.id})}" class="btn btn-encabezado rounded-pill px-4">
                            Editar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
