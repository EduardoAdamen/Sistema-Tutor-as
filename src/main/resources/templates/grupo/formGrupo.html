<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header mi-etiqueta pt-3 pb-3">
                        <span th:text="${grupo.id == null ? 'Nuevo Grupo' : 'Editar Grupo'}"></span>
                    </div>
                    <div class="card-body">
                        
                        <div th:if="${error}" class="alert alert-danger fade show shadow-sm" role="alert">
                            <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/grupo/guardar}" th:object="${grupo}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre del Grupo:</label>
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required maxlength="20" placeholder="Ej. 6-A" />
                            </div>

                            <div class="mb-4">
                                <label for="carrera" class="form-label fw-bold">Carrera:</label>
                                <select id="carrera" th:field="*{carrera}" class="form-select" required>
                                    <option value="" disabled selected>-- Seleccione Carrera --</option>
                                    <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"></option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/grupo/grupos}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-encabezado">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>
</body>
</html>
