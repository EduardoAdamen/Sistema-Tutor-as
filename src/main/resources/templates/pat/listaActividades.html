<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <h2 class="mi-titulo mb-2">
            Actividades
        </h2>
        <h5 class="text-muted mb-4" th:if="${tutor != null}">Tutor: <span th:text="${tutor.nombreCompleto}"></span></h5>
        
        <div th:if="${msg}" class="alert alert-success mb-4 shadow-sm" th:text="${msg}"></div>
        <div th:if="${error}" class="alert alert-danger mb-4 shadow-sm" th:text="${error}"></div>

        <!-- Barra de filtros -->
        <form th:action="@{/pat/actividades}" method="get" class="d-flex flex-wrap gap-3 mb-4 align-items-center">
            <div class="card shadow-sm rounded-4 border-0 flex-grow-1" style="min-width: 200px;">
                <label class="visually-hidden" for="periodoId">Periodo</label>
                <select name="periodoId" id="periodoId" class="form-select border-0 px-3 py-2 bg-transparent rounded-4">
                    <option value="">-- Todos los Periodos --</option>
                    <option th:each="p : ${periodos}" th:value="${p.id}" th:text="|${p.clave} (${p.estatus.name()})|" th:selected="${p.id == filtroPeriodoId}"></option>
                </select>
            </div>
            
            <div class="card shadow-sm rounded-4 border-0 flex-grow-1" style="min-width: 200px;" th:if="${tutores != null}">
                <label class="visually-hidden" for="tutorId">Tutor</label>
                <select name="tutorId" id="tutorId" class="form-select border-0 px-3 py-2 bg-transparent rounded-4">
                    <option value="">-- Todos los Tutores --</option>
                    <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.usuario.nombreCompleto}" th:selected="${t.id == filtroTutorId}"></option>
                </select>
            </div>

            <div class="card shadow-sm rounded-4 border-0 flex-grow-1" style="min-width: 200px;">
                <label class="visually-hidden" for="tipoActividad">Tipo de Actividad</label>
                <select name="tipoActividad" id="tipoActividad" class="form-select border-0 px-3 py-2 bg-transparent rounded-4">
                    <option value="">-- Todos los Tipos --</option>
                    <option th:each="t : ${tiposActividad}" th:value="${t.name()}" th:text="${t.name()}" th:selected="${t.name() == filtroTipoActividad}"></option>
                </select>
            </div>

            <div class="flex-shrink-0">
                <button type="submit" class="btn btn-secondary rounded-4 px-4 py-2 shadow-sm d-flex align-items-center justify-content-center border-0">
                    <i class="bi bi-funnel me-2"></i> Filtrar
                </button>
            </div>
        </form>

        <div class="card shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive m-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Asignación / Grupo</th>
                            <th>Fecha de Sesión</th>
                            <th>Evidencia</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${actividades}">
                            <td th:text="${a.id}">1</td>
                            <td th:text="${a.titulo}">Taller de estudio</td>
                            <td th:text="${a.tipoActividad}">Taller</td>
                            <td>
                                <span th:if="${tutor == null}">Tutor: <strong th:text="${a.sesion.asignacion.tutor.usuario.nombreCompleto}"></strong><br></span>
                                Carrera: <strong th:text="${a.sesion.asignacion.grupo.carrera.nombre}"></strong><br>
                                Grupo: <span th:text="${a.sesion.asignacion.grupo.nombre}"></span>
                            </td>
                            <td th:text="${#temporals.format(a.sesion.fecha, 'dd/MM/yyyy')}">10/10/2023</td>
                            <td>
                                <span th:if="${a.evidencia != null}">
                                    <a th:href="@{'/uploads/actividades/' + ${a.evidencia}}" target="_blank" class="btn btn-sm btn-outline-info">Ver Archivo</a>
                                </span>
                                <span th:if="${a.evidencia == null}" class="text-muted">Sin evidencia</span>
                            </td>
                            <td>
                                  <a th:href="@{/pat/detalle/{id}(id=${a.id})}" class="btn-crud btn-detalle" title="Ver Detalles">
                                      <i class="bi bi-eye"></i>
                                  </a>
                                  <a th:href="@{/pat/editar/{id}(id=${a.id})}" class="btn-crud btn-editar" title="Editar">
                                      <i class="bi bi-pencil"></i>
                                  </a>
                                  <a th:href="@{/pat/eliminar/{id}(id=${a.id})}" class="btn-crud btn-eliminar" title="Eliminar"
                                     onclick="return confirm('¿Está seguro de eliminar esta actividad?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${actividades == null or actividades.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-4">No existen actividades en el periodo activo.</td>
                        </tr>
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
