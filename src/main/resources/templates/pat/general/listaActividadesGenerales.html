<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <main class="container my-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mi-titulo mb-0"><i class="bi bi-journal-bookmark-fill me-2"></i>Actividades PAT Generales</h2>
            <a th:href="@{/pat/general/nueva}" class="btn btn-encabezado">
                <i class="bi bi-plus-circle me-1"></i> Nueva Actividad
            </a>
        </div>
        
        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" th:text="${msg}">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive m-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Título</th>
                            <th>Tipo de Actividad</th>
                            <th>Descripción</th>
                            <th>Fecha Registro</th>
                            <th class="text-center pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${actividades}">
                            <td class="ps-4" th:text="${a.id}">1</td>
                            <td class="fw-semibold" th:text="${a.titulo}">Taller</td>
                            <td><span class="badge bg-secondary px-3 py-2" th:text="${a.tipoActividad}">taller</span></td>
                            <td class="text-muted" th:text="${a.descripcion != null ? (a.descripcion.length() > 60 ? a.descripcion.substring(0, 60) + '...' : a.descripcion) : 'Sin descripción'}">Desc</td>
                            <td th:text="${a.fechaRegistro != null ? #temporals.format(a.fechaRegistro, 'dd/MM/yyyy HH:mm') : '-'}">10/10/2025</td>
                            <td class="text-center pe-4">
                                <div class="d-flex justify-content-center gap-2">
                                    <a th:href="@{/pat/general/editar/{id}(id=${a.id})}" class="btn-crud btn-editar" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/pat/general/eliminar/{id}(id=${a.id})}" class="btn-crud btn-eliminar" title="Eliminar"
                                       onclick="return confirm('¿Está seguro de eliminar esta actividad general?');">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${actividades == null or actividades.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">No hay actividades PAT generales registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>
</body>
</html>
