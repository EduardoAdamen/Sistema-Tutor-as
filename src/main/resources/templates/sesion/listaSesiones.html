<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===================== HEAD ===================== -->
<head th:replace="~{fragments/fragment :: head}"></head>

<body>

<!-- ===================== NAVBAR ===================== -->
<nav th:replace="~{fragments/fragment :: navbar}"></nav>

<!-- ===================== CONTENIDO ===================== -->
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h2 class="mi-titulo m-0">Mis Sesiones</h2>
        <a th:href="@{/sesion/nueva}" class="btn btn-encabezado shadow-sm">
            <i class="bi bi-plus-lg me-1"></i> Registrar Sesión
        </a>
    </div>

    <!-- Mensajes Flash -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover bordes-fuertes mb-0 align-middle">
                    <thead class="mi-etiqueta">
                        <tr>
                            <th class="ps-4">Fecha</th>
                            <th>H. Inicio</th>
                            <th>H. Fin</th>
                            <th class="text-center">Evidencia</th>
                            <th class="text-center">Total Tutorados</th>
                            <th class="text-center pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(sesiones)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No hay sesiones registradas en este periodo.
                            </td>
                        </tr>
                        <tr th:each="sesion : ${sesiones}">
                            <td class="ps-4 fw-semibold" th:text="${sesion.fecha}">2026-04-26</td>
                            <td th:text="${sesion.horaInicio}">10:00</td>
                            <td th:text="${sesion.horaFin}">12:00</td>
                            <td class="text-center">
                                <a th:if="${sesion.evidencia != null and !sesion.evidencia.isEmpty()}" 
                                   th:href="@{'/uploads/sesiones/' + ${sesion.evidencia}}" 
                                   target="_blank" class="btn btn-sm btn-outline-primary" title="Ver Evidencia">
                                    <i class="bi bi-file-earmark-text"></i> Archivo
                                </a>
                                <span th:unless="${sesion.evidencia != null and !sesion.evidencia.isEmpty()}" class="text-muted small">N/A</span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-secondary rounded-pill form-text text-white">
                                    <i class="bi bi-people-fill me-1"></i> <span th:text="${asignacion.tutor.id > 0 ? 'Grupo' : '0'}">Grupo</span>
                                </span>
                            </td>
                            <td class="text-center pe-4">
                                <!-- Detalle -->
                                <a th:href="@{/sesion/ver/{id}(id=${sesion.id})}" class="btn-crud btn-ver" title="Ver Detalle / Asistencia">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <!-- Registrar Asistencia Directo-->
                                <a th:href="@{/asistencia/registrar/{id}(id=${sesion.id})}" class="btn-crud bg-success text-white" title="Registrar Asistencia">
                                    <i class="bi bi-clipboard2-check"></i>
                                </a>
                                <!-- Editar -->
                                <a th:href="@{/sesion/editar/{id}(id=${sesion.id})}" class="btn-crud btn-editar ms-1" title="Editar Sesión">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <!-- Eliminar -->
                                <a th:href="@{/sesion/eliminar/{id}(id=${sesion.id})}" class="btn-crud btn-eliminar ms-1" 
                                   title="Eliminar Sesión" onclick="return confirm('¿Está seguro de eliminar esta sesión?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ===================== FOOTER ===================== -->
<footer th:replace="~{fragments/fragment :: footer}"></footer>
<div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
