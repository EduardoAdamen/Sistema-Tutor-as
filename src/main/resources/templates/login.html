<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Tutorías ITCH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; /* Light grey background similar to default */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .form-signin {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            margin: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .form-signin .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
        }
        .form-signin .form-control:focus {
            z-index: 2;
        }
        .form-signin input[type="text"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }
        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        .form-signin h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: normal;
            text-align: center;
        }
    </style>
</head>
<body class="text-center">

    <main class="form-signin w-100 m-auto">
        <form th:action="@{/login}" method="post">
            <h2 class="h3 mb-3 fw-bold" style="color: #1e3c72;">Sistema de Tutorías ITCH</h2>
            <img th:src="@{/images/logos/logo1.jpeg}" alt="Logo ITCH" class="mb-5 mt-2" style="max-width: 110px; height: auto;">

            <div th:if="${error}" class="alert alert-danger p-2" role="alert">
                Credenciales inválidas
            </div>
            
            <div th:if="${logout}" class="alert alert-success p-2" role="alert">
                Has cerrado sesión exitosamente
            </div>
            
            <div th:if="${msg}" class="alert alert-success p-2" role="alert" th:text="${msg}"></div>

            <p class="text-muted mb-3" style="font-size: 0.9rem;">Ingrese número de empleado o número de control</p>

            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="username" name="username" placeholder="Número de empleado o control" required autofocus>
                <label for="username">Número de empleado o control</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password">Contraseña</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary mb-2" type="submit" style="background-color: #1e3c72; border-color: #1e3c72;">Ingresar</button>
            <a th:href="@{/registro}" class="w-100 btn btn-lg btn-outline-secondary">Registrarse</a>
        </form>
    </main>

</body>
</html>
