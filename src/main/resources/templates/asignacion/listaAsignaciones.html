<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <main class="container my-4 flex-grow-1">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mi-titulo mb-0">Gestión de Asignaciones</h2>
            <a th:href="@{/asignacion/nuevo}" class="btn btn-encabezado">
                <i class="bi bi-plus-circle"></i> Nueva Asignación
            </a>
        </div>

        <!-- Filtro Periodo -->
        <form th:action="@{/asignacion/asignaciones}" method="get" class="d-flex flex-wrap gap-3 mb-4 align-items-center justify-content-start">
            <div class="d-flex align-items-center">
                 <label for="periodoId" class="form-label mb-0 text-secondary fw-medium me-2">Filtrar por Periodo:</label>
            </div>
            <div class="card shadow-sm rounded-4 border-0 flex-grow-1" style="max-width: 350px;">
                <select name="periodoId" id="periodoId" class="form-select border-0 px-3 py-2 bg-transparent rounded-4">
                    <option value="">-- Todos los Periodos --</option>
                    <option th:each="p : ${periodos}" th:value="${p.id}" th:text="|${p.clave} (${p.estatus.name()})|" th:selected="${p.id == filtroPeriodoId}"></option>
                </select>
            </div>
            <div class="flex-shrink-0">
                 <button type="submit" class="btn btn-secondary rounded-4 px-4 py-2 shadow-sm d-flex align-items-center justify-content-center border-0">
                     <i class="bi bi-filter me-2"></i> Filtrar
                 </button>
            </div>
        </form>

        <div class="card shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive m-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                        <th>Tutor Encargado</th>
                        <th>Carrera</th>
                        <th>Grupo</th>
                        <th>Aula</th>
                        <th>Día y Hora</th>
                        <th>Periodo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${asignaciones}">
                        <td th:text="${a.id}"></td>
                        <td th:text="${a.tutor.usuario.nombreCompleto}"></td>
                        <td th:text="${a.grupo.carrera.nombre}"></td>
                        <td th:text="${a.grupo.nombre}"></td>
                        <td th:text="${a.aula}"></td>
                        <td>
                            <span th:text="${a.diaHorario}"></span> <br>
                            <small th:text="${a.horaHorario}"></small>
                        </td>
                        <td>
                            <span th:if="${a.periodo.estatus.name() == 'activo'}" class="badge bg-success" th:text="${a.periodo.clave}"></span>
                            <span th:if="${a.periodo.estatus.name() == 'cerrado'}" class="badge bg-secondary" th:text="${a.periodo.clave}"></span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/asignacion/inscripcion/{id}(id=${a.id})}" class="btn-crud btn-primary text-white" style="background-color: #0d6efd;" title="Inscribir Alumnos">
                                    <i class="bi bi-person-plus"></i>
                                </a>
                                <a th:href="@{/asignacion/ver/{id}(id=${a.id})}" class="btn-crud btn-ver" title="Ver">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/asignacion/editar/{id}(id=${a.id})}" class="btn-crud btn-editar" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/asignacion/eliminar/{id}(id=${a.id})}" class="btn-crud btn-eliminar" title="Eliminar"
                                   onclick="return confirm('¿Confirma eliminar esta asignación?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(asignaciones)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-info-circle"></i> No hay asignaciones registradas para esta vista.
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>
</body>
</html>
