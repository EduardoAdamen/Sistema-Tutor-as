<!DOCTYPE html>


<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head th:replace="~{fragments/fragment :: head}"></head>


<body class="d-flex flex-column min-vh-100">





    <nav th:replace="~{fragments/fragment :: navbar}"></nav>





    <main class="container my-4 flex-grow-1">


        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">


            <span th:text="${msg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>


        </div>


        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">


            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>


        </div>





        <div class="d-flex justify-content-between align-items-center mb-4">


            <h2 class="mi-titulo mb-0">


                Inscribir Alumnos <br>


                <small class="text-muted fs-6" th:text="|Grupo: ${asignacion.grupo.nombre} - ${asignacion.grupo.carrera.nombre}|"></small>


            </h2>


            <a th:href="@{/asignacion/asignaciones}" class="btn btn-outline-secondary">


                <i class="bi bi-arrow-left"></i> Volver


            </a>


        </div>





        <!-- Formulario para agregar tutorado -->


        <div class="card shadow-sm rounded-4 overflow-hidden mb-4" th:if="${session.usuarioLogueado != null and session.usuarioLogueado.hasPerfil('ADMINISTRADOR')}">


            <div class="card-body bg-light border-bottom p-3">


                <form th:action="@{/asignacion/{id}/agregar-tutorado(id=${asignacion.id})}" method="post" class="row g-2 align-items-center">


                    <div class="col">


                        <input type="text" name="numeroIdentificacion" class="form-control" placeholder="Ingresa No. Control" required>


                    </div>


                    <div class="col-auto">


                        <button type="submit" class="btn btn-secondary">Inscribir</button>


                    </div>


                </form>


            </div>


        </div>





        <!-- Tabla de tutorados inscritos -->


        <div class="card shadow-sm rounded-4 overflow-hidden">


            <div class="card-header bg-transparent border-bottom pt-3 pb-3 d-flex justify-content-between align-items-center">


                <span>Tutorados Inscritos</span>


                <span class="badge bg-light text-dark border">Total: <span th:text="${#lists.size(asigTutorados)}"></span></span>


            </div>


            <div class="table-responsive m-0">


                <table class="table table-hover align-middle mb-0">


                    <thead class="table-light">


                        <tr>


                            <th class="ps-4">Tutorado</th>


                            <th>Matrícula</th>


                            <th th:if="${session.usuarioLogueado != null and session.usuarioLogueado.hasPerfil('ADMINISTRADOR')}" class="text-center pe-4">Acción</th>


                        </tr>


                    </thead>


                    <tbody>


                        <tr th:each="at : ${asigTutorados}">


                            <td class="ps-4" th:text="${at.tutorado.usuario.nombreCompleto}"></td>


                            <td th:text="${at.tutorado.usuario.numeroIdentificacion}"></td>


                            <td th:if="${session.usuarioLogueado != null and session.usuarioLogueado.hasPerfil('ADMINISTRADOR')}" class="text-center pe-4">


                                <a th:href="@{/asignacion/{id}/quitar-tutorado/{tId}(id=${asignacion.id}, tId=${at.tutorado.id})}" 


                                   class="btn btn-sm btn-outline-danger"


                                   onclick="return confirm('¿Remover este alumno de la asignación?')">


                                   Quitar


                                </a>


                            </td>


                        </tr>


                        <tr th:if="${asigTutorados.empty}">


                            <td th:colspan="${session.usuarioLogueado != null and session.usuarioLogueado.hasPerfil('ADMINISTRADOR') ? 3 : 2}" class="text-center py-4 text-muted">


                                No hay tutorados asignados a este grupo.


                            </td>


                        </tr>


                    </tbody>


                </table>


            </div>


        </div>


    </main>





    <footer th:replace="~{fragments/fragment :: footer}"></footer>


    <div th:replace="~{fragments/fragment :: scripts}"></div>


</body>


</html>
