<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Tutorías ITCH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .form-signin {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            margin: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .form-signin h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: normal;
            text-align: center;
        }
    </style>
</head>
<body class="text-center">

    <main class="form-signin w-100 m-auto">
        <form th:action="@{/registro}" method="post">
            <h2 class="h3 mb-3 fw-bold" style="color: #1e3c72;">Crea una Cuenta</h2>

            <div th:if="${error}" class="alert alert-danger p-2" role="alert" th:text="${error}"></div>
            <div th:if="${msg}" class="alert alert-success p-2" role="alert" th:text="${msg}"></div>

            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required autofocus>
                <label for="username">Usuario (No. Control/Empleado)</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required pattern="^(?=.*[A-Za-z])(?=.*\d).*$" title="Mínimo 8 caracteres, letras y números" minlength="8">
                <label for="password">Contraseña</label>
            </div>
            
            <div class="form-floating mb-3">
                <select class="form-select" id="role" name="role" required>
                    <option value="" disabled selected>Selecciona un rol</option>
                    <option value="ROLE_USER">Tutorado</option>
                    <option value="ROLE_TUTOR">Tutor</option>
                </select>
                <label for="role">Rol</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary mb-2" type="submit" style="background-color: #1e3c72; border-color: #1e3c72;">Registrarse</button>
            <a th:href="@{/login}" class="w-100 btn btn-lg btn-outline-secondary">Volver al login</a>
        </form>
    </main>

</body>
</html>
