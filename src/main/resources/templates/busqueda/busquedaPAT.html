<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <h2 class="mi-titulo mb-4">
            Reporte General: Actividades
        </h2>
        <hr>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light">
                <strong>Filtros de Búsqueda Avanzada</strong>
            </div>
            <div class="card-body">
                <form th:action="@{/busqueda/pat}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label for="inicio" class="form-label">Fecha Inicio</label>
                        <input type="date" name="inicio" id="inicio" class="form-control" th:value="${filtroInicio}" />
                    </div>
                    <div class="col-md-3">
                        <label for="fin" class="form-label">Fecha Fin</label>
                        <input type="date" name="fin" id="fin" class="form-control" th:value="${filtroFin}" />
                    </div>
                    <div class="col-md-3">
                        <label for="tipo" class="form-label">Tipo Actividad</label>
                        <select name="tipo" id="tipo" class="form-select">
                            <option value="">Todas</option>
                            <option th:each="t : ${tiposActividad}"
                                    th:value="${t}"
                                    th:text="${t}"
                                    th:selected="${t == filtroTipo}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="carreraId" class="form-label">Carrera</label>
                        <select name="carreraId" id="carreraId" class="form-select">
                            <option value="">Todas</option>
                            <option th:each="c : ${carreras}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}"
                                    th:selected="${c.id == filtroCarreraId}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4 mt-3">
                        <label for="tutorId" class="form-label">Tutor (Opcional)</label>
                        <select name="tutorId" id="tutorId" class="form-select">
                            <option value="">Cualquier Tutor</option>
                            <option th:each="tut : ${tutores}"
                                    th:value="${tut.id}"
                                    th:text="${tut.usuario.nombreCompleto}"
                                    th:selected="${tut.id == filtroTutorId}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-12 text-end mt-4">
                        <a th:href="@{/busqueda/pat}" class="btn btn-secondary me-2">Limpiar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-funnel"></i> Filtrar Actividades
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <h4 th:if="${actividades != null}" class="mt-4 mb-3">
            Resultados (Total: <span th:text="${#lists.size(actividades)}"></span>)
        </h4>

        <div th:if="${actividades != null}">
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID Actividad</th>
                        <th>Título / Tipo</th>
                        <th>Fecha de Sesión</th>
                        <th>Tutor Encargado</th>
                        <th>Carrera / Grupo</th>
                        <th>Evidencia</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="act : ${actividades}">
                        <td th:text="${act.id}">1</td>
                        <td>
                            <strong th:text="${act.titulo}">Taller</strong><br>
                            <span class="badge bg-info text-dark" th:text="${act.tipoActividad}">Taller</span>
                        </td>
                        <td>
                            <span th:text="${#temporals.format(act.sesion.fecha, 'dd/MM/yyyy')}"></span><br>
                            <span th:text="${act.sesion.horaInicio}"></span>
                        </td>
                        <td th:text="${act.sesion.asignacion.tutor.usuario.nombreCompleto}">Juan Pérez</td>
                        <td>
                            <span th:text="${act.sesion.asignacion.grupo.carrera.nombre}"></span><br>
                            Grupo: <strong th:text="${act.sesion.asignacion.grupo.nombre}"></strong>
                        </td>
                        <td>
                            <span th:if="${act.evidencia != null}">
                                <a th:href="@{'/uploads/actividades/' + ${act.evidencia}}" target="_blank" class="btn btn-sm btn-outline-success">Ver</a>
                            </span>
                            <span th:if="${act.evidencia == null}" class="text-muted">No adjuntada</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(actividades)}">
                        <td colspan="6" class="text-center text-muted py-4">No se encontraron actividades que coincidan con los criterios.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
