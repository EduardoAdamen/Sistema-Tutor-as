<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragment :: head}"></head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <h2 class="mi-titulo mb-4">Buscar tutorado</h2>

        <!-- Filtros -->
        <form th:action="@{/busqueda/tutorado}" method="get" class="d-flex flex-wrap gap-3 mb-4 align-items-end">
            <div class="flex-grow-1" style="min-width: 150px;">
                <label for="numeroControl" class="form-label small text-muted">Número de Control</label>
                <input type="text" name="numeroControl" id="numeroControl" class="form-control"
                    th:value="${filtroNumeroControl}" placeholder="Ej. 20520371" />
            </div>
            <div class="flex-grow-1" style="min-width: 150px;">
                <label for="nombre" class="form-label small text-muted">Nombre del Tutorado</label>
                <input type="text" name="nombre" id="nombre" class="form-control" th:value="${filtroNombre}"
                    placeholder="Ej. Juan Pérez" />
            </div>
            <div class="flex-grow-1" style="min-width: 150px;">
                <label for="carreraId" class="form-label small text-muted">Carrera</label>
                <select name="carreraId" id="carreraId" class="form-select">
                    <option value="">Todas las Carreras</option>
                    <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${c.id == filtroCarreraId}">
                    </option>
                </select>
            </div>
            <div class="flex-shrink-0 d-flex gap-2">
                <button type="submit" class="btn btn-secondary rounded-4 px-4 py-2 shadow-sm">
                    <i class="bi bi-funnel me-1"></i> Filtrar
                </button>
                <a th:href="@{/busqueda/tutorado}" class="btn btn-outline-secondary rounded-4 px-4 py-2">Limpiar</a>
            </div>
        </form>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Tabla de resultados de búsqueda por Filtros -->
        <div th:if="${resultadosTutorados != null}" class="card shadow-sm rounded-4 overflow-hidden mb-4">
            <div class="table-responsive m-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">No. Control</th>
                            <th>Nombre Completo</th>
                            <th>Carrera</th>
                            <th>Tutor Asignado</th>
                            <th>Grupo / Aula</th>
                            <th>Horario</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${resultadosTutorados}">
                            <td class="ps-4 font-monospace fw-semibold text-secondary"
                                th:text="${t.usuario.numeroIdentificacion}"></td>
                            <td th:text="${t.usuario.nombreCompleto}" class="fw-semibold text-dark"></td>
                            <td th:text="${t.carrera.nombre}"></td>
                            <td>
                                <span th:if="${asignacionesMap.containsKey(t.id)}"
                                    th:text="${asignacionesMap[t.id].tutor.usuario.nombreCompleto}">Tutor</span>
                                <span th:unless="${asignacionesMap.containsKey(t.id)}" class="text-muted small">Sin
                                    asignar</span>
                            </td>
                            <td>
                                <span th:if="${asignacionesMap.containsKey(t.id)}">
                                    Grupo: <strong th:text="${asignacionesMap[t.id].grupo.nombre}"></strong><br>
                                    Aula: <span th:text="${asignacionesMap[t.id].aula}"></span>
                                </span>
                                <span th:unless="${asignacionesMap.containsKey(t.id)}" class="text-muted small">-</span>
                            </td>
                            <td>
                                <span th:if="${asignacionesMap.containsKey(t.id)}">
                                    <span th:text="${asignacionesMap[t.id].diaHorario}"></span><br>
                                    <span
                                        th:text="${#temporals.format(asignacionesMap[t.id].horaHorario, 'HH:mm')} + ' - ' + ${#temporals.format(asignacionesMap[t.id].horaFinHorario, 'HH:mm')}"></span>
                                </span>
                                <span th:unless="${asignacionesMap.containsKey(t.id)}" class="text-muted small">-</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(resultadosTutorados)}">
                            <td colspan="6" class="text-center text-muted py-4">No se encontraron tutorados que
                                coincidan con la búsqueda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Volver al
                Inicio</a>
        </div>

    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>

    <!-- Scripts -->
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>

</html>
