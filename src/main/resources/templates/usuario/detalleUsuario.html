<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-transparent border-bottom pt-3 pb-3">
                        <span class="fs-5 fw-bold text-dark">Detalle de Usuario</span>
                    </div>
                    <div class="card-body p-4">
                        <table class="table table-borderless mb-0">
                            <tr>
                                <th class="text-end fw-bold text-dark" style="width: 45%;">ID:</th>
                                <td class="text-secondary" th:text="${usuario.id}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Identificación:</th>
                                <td class="text-secondary" th:text="${usuario.numeroIdentificacion}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Nombre Completo:</th>
                                <td class="text-secondary fw-bold" th:text="${usuario.nombreCompleto}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Correo Electrónico:</th>
                                <td class="text-secondary" th:text="${usuario.correo}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Rol en Sistema:</th>
                                <td>
                                    <span th:if="${usuario.hasPerfil('ADMINISTRADOR')}" class="badge bg-primary rounded-pill px-3 py-2">Administrador</span>
                                    <span th:if="${usuario.hasPerfil('TUTOR')}" class="badge bg-success rounded-pill px-3 py-2">Tutor</span>
                                    <span th:if="${usuario.hasPerfil('TUTORADO')}" class="badge bg-info text-dark rounded-pill px-3 py-2">Tutorado</span>
                                </td>
                            </tr>
                            <tr th:if="${usuario.hasPerfil('TUTORADO')}">
                                <th class="text-end fw-bold text-dark">Carrera:</th>
                                <td class="text-secondary" th:text="${carreraNombre != null ? carreraNombre : 'Sin carrera asignada'}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Fecha de Registro:</th>
                                <td class="text-secondary" th:text="${#temporals.format(usuario.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark">Estado:</th>
                                <td>
                                    <span th:if="${usuario.estado.name() == 'activo'}" class="badge bg-success rounded-pill px-3 py-2">Activo</span>
                                    <span th:if="${usuario.estado.name() == 'inactivo'}" class="badge bg-secondary rounded-pill px-3 py-2">Inactivo</span>
                                </td>
                            </tr>
                            <tr>
                                <th class="text-end fw-bold text-dark align-middle">Foto de Perfil:</th>
                                <td>
                                    <img th:if="${usuario.fotoPerfil != null}" th:src="@{'/uploads/usuarios/' + ${usuario.fotoPerfil}}" alt="Foto de Perfil" class="rounded-circle shadow-sm object-fit-cover" style="width: 80px; height: 80px; border: 3px solid white;">
                                    <img th:if="${usuario.fotoPerfil == null}" src="/img/sin-imagen.png" alt="Sin foto" class="rounded-circle shadow-sm opacity-50 object-fit-cover" style="width: 80px; height: 80px; border: 3px solid white;">
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="card-footer bg-transparent border-top p-3 d-flex justify-content-between">
                        <a th:href="@{/usuario/usuarios}" class="btn btn-outline-secondary rounded-pill px-4">
                            Volver al listado
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>

</body>
</html>
