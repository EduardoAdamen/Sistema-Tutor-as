<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragment :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <nav th:replace="~{fragments/fragment :: navbar}"></nav>

    <main class="container my-4 flex-grow-1">

        <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mi-titulo mb-0">Gestión de Usuarios</h2>
            <a th:href="@{/usuario/nuevo}" class="btn btn-encabezado">
                <i class="bi bi-plus-circle"></i> Nuevo Usuario
            </a>
        </div>

        <!-- Barra de filtros -->
        <div class="card mb-4 shadow-sm border-0 bg-light">
            <div class="card-body py-3">
                <form th:action="@{/usuario/usuarios}" method="get" class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <label class="visually-hidden" for="perfilNombre">Perfil</label>
                        <select name="perfilNombre" id="perfilNombre" class="form-select border-0 shadow-sm">
                            <option value="">-- Todos los Perfiles --</option>
                            <option th:each="p : ${perfiles}" th:value="${p.nombre}" th:text="${p.nombre}" th:selected="${p.nombre == filtroPerfilNombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="visually-hidden" for="carreraId">Carrera</label>
                        <select name="carreraId" id="carreraId" class="form-select border-0 shadow-sm">
                            <option value="">TODAS LAS CARRERAS</option>
                            <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${c.id == filtroCarreraId}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="visually-hidden" for="estado">Estado</label>
                        <select name="estado" id="estado" class="form-select border-0 shadow-sm">
                            <option value="">TODOS LOS ESTADOS</option>
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${e == filtroEstado}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 text-end">
                        <button type="submit" class="btn btn-secondary w-100 rounded-pill shadow-sm">
                            <i class="bi bi-funnel"></i> Filtrar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive bg-white rounded-3 shadow-sm">
            <table class="table table-hover bordes-fuertes align-middle mb-0">
                <thead class="table-light">
                    <tr class="mi-etiqueta">
                        <th class="ps-4">Foto</th>
                        <th>Identificación</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Carrera</th>
                        <th>Estado</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td class="ps-4">
                            <img th:if="${u.fotoPerfil != null}" th:src="@{'/uploads/usuarios/' + ${u.fotoPerfil}}" alt="Foto" width="40" height="40" class="rounded-circle object-fit-cover shadow-sm">
                            <img th:if="${u.fotoPerfil == null}" src="/img/sin-imagen.png" alt="Sin foto" width="40" height="40" class="rounded-circle object-fit-cover opacity-50 shadow-sm">
                        </td>
                        <td th:text="${u.numeroIdentificacion}" class="font-monospace text-secondary"></td>
                        <td th:text="${u.nombreCompleto}" class="fw-semibold"></td>
                        <td th:text="${u.correo}"></td>
                        <td>
                            <span class="badge rounded-pill bg-primary" th:if="${u.hasPerfil('ADMINISTRADOR')}">Admin</span>
                            <span class="badge rounded-pill bg-success" th:if="${u.hasPerfil('TUTOR')}">Tutor</span>
                            <span class="badge rounded-pill bg-info text-dark" th:if="${u.hasPerfil('TUTORADO')}">Tutorado</span>
                            <span th:if="${!u.hasPerfil('ADMINISTRADOR') and !u.hasPerfil('TUTOR') and !u.hasPerfil('TUTORADO')}">Sin Perfil</span>
                        </td>
                        <td class="text-secondary small">
                            <span th:if="${u.hasPerfil('TUTORADO')}" class="text-muted fst-italic">Ver en Detalle</span>
                            <span th:if="${!u.hasPerfil('TUTORADO')}" class="text-muted fst-italic">N/A</span>
                        </td>
                        <td>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25" th:if="${u.estado.name() == 'activo'}"><i class="bi bi-check-circle me-1"></i>Activo</span>
                            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25" th:if="${u.estado.name() == 'inactivo'}"><i class="bi bi-x-circle me-1"></i>Inactivo</span>
                        </td>
                        <td class="text-center pe-4">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/usuario/ver/{id}(id=${u.id})}" class="btn-crud btn-ver" title="Ver">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/usuario/editar/{id}(id=${u.id})}" class="btn-crud btn-editar" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:if="${u.estado.name() == 'activo'}" th:href="@{/usuario/desactivar/{id}(id=${u.id})}" class="btn-crud btn-eliminar" title="Desactivar"
                                   onclick="return confirm('¿Está seguro de desactivar este usuario?');">
                                    <i class="bi bi-person-x"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-info-circle"></i> No hay usuarios registrados con los filtros actuales.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <footer th:replace="~{fragments/fragment :: footer}"></footer>
    <div th:replace="~{fragments/fragment :: scripts}"></div>
</body>
</html>
