# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sistema_tutorias}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}


# Thymeleaf
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# 
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Administrador inicial
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:admin@itch.edu.mx}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Administrador del Sistema}
app.admin.reset-password=${APP_ADMIN_RESET_PASSWORD:false}

# Almacenamiento en disco local o volumen Docker
storage.location=${STORAGE_LOCATION:./uploads}

# Subcarpetas por tipo de evidencia
storage.folder.usuarios=usuarios
storage.folder.sesiones=sesiones
storage.folder.actividades=actividades

